<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Live View Config — RGC Volleyball Scorekeeper</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <div class="page">
    <div class="topbar">
      <h1>Live View Config</h1>
      <div class="topbar-actions">
        <a href="live-view.html" target="_blank" rel="noopener" class="btn btn-tint-blue">📡 Open Live View</a>
        <a href="home.html" class="topbar-close">✕</a>
      </div>
    </div>
    <div class="page-content" style="max-width: 800px;">
      <div class="card" style="margin-bottom: 20px;">
        <div class="card-header">
          <span>Assign Matches</span>
          <span class="muted" id="live-count-label">0/3 tagged</span>
        </div>
        <hr class="card-divider" />
        <p class="hint-text" style="padding: 12px 20px 0;">
          Choose up to 3 matches to show on the Live View screen. Add or
          remove matches at any time — changes appear on Live View instantly.
        </p>
        <div id="matches-list" style="padding-top: 8px;">
          <p class="card-empty">Loading…</p>
        </div>
        <p id="config-error" class="error-text hidden" style="padding: 0 20px 16px;"></p>
      </div>
    </div>
  </div>

  <script type="module" src="js/pages/live-view-config.js"></script>
</body>
</html>
